version: 2
models:
- name: int_world_output__yearly
  description: 'Metric 3: world real output (GDP, constant 2015 US$) in every year from GTA 5''s launch year to GTA 6''s, and its even daily and per-second rates. One row per year.'
  config:
    meta:
      dex:
        grain:
          - data_year
        population:
          rule: Every year from var gta_v_year (2013) to var gta_6_year (2026), published or not; an unpublished, unestimated year keeps its row with NULL output.
        assumptions:
          - decision: What 'everything humanity made' measures
            chosen: World Bank world real GDP, NY.GDP.MKTP.KD, constant 2015 US$
            evidence: request
            detail: 'user: Metric 3 plan, world output between GTA 5 and GTA 6; same price basis as Metric 2''s per-capita series'
            column: annual_output
          - decision: Years covered
            chosen: 2013 to 2026, every year
            evidence: request
            detail: 'user: bookended by the GTA 5 and GTA 6 releases (17 Sep 2013, 19 Nov 2026)'
            column: data_year
          - decision: Years the World Bank has not published
            chosen: last published GDP grown by IMF WEO world real GDP growth, no population adjustment, flagged is_estimate
            evidence: precedent
            detail: fct_world_productivity carries the unpublished year with the same IMF chain; total output takes no per-capita adjustment
            column: annual_output
          - decision: Daily output within a year
            chosen: spread evenly over the year's days (365 or 366)
            evidence: default
            detail: GDP is published yearly; no seasonality is claimed
            column: daily_output
  columns:
    - name: data_year
      description: Calendar year.
      config:
        meta:
          dex:
            role: key
            null_rule: never
      data_tests:
        - unique
        - not_null
    - name: annual_output
      description: World real GDP in the year, constant 2015 US$.
      config:
        meta:
          dex:
            role: measure
            null_rule: 'NULL when unpublished and not estimated: unavailable, never zero.'
            aggregation: sum
            additivity: additive
            unit: currency:USD
    - name: is_estimate
      description: True when carried by IMF growth, not published by the World Bank.
      config:
        meta:
          dex:
            role: attribute
            null_rule: never
      data_tests:
        - not_null
    - name: days_in_year
      description: 365, or 366 in a leap year.
      config:
        meta:
          dex:
            role: attribute
            null_rule: never
            unit: days
      data_tests:
        - not_null
    - name: daily_output
      description: 'annual_output / days_in_year: the year spread evenly over its days.'
      config:
        meta:
          dex:
            role: measure
            null_rule: NULL when annual_output is.
            aggregation: sum
            additivity: additive
            unit: currency:USD
    - name: output_per_second
      description: 'daily_output / 86400: a rate, the yearly average spread evenly.'
      config:
        meta:
          dex:
            role: measure
            null_rule: NULL when annual_output is.
            aggregation: max
            additivity: non_additive
            unit: currency:USD
    - name: source_indicator
      description: World Bank indicator code.
      config:
        meta:
          dex:
            role: attribute
            null_rule: never
      data_tests:
        - not_null
unit_tests:
