version: 2

semantic_models:
  - name: dim_date
    description: 'One row per UTC day from 2025-10-01 to 2026-12-31, placed relative to that year''s release Thursday. Population: Every calendar day in the spine; 2025 days belong to the control year (anchor Thu 20 Nov 2025), 2026 days to the study (anchor Thu 19 Nov 2026).'
    model: ref('dim_date')
    entities:
      - name: date_day
        type: primary
        expr: date_day
        config:
          meta:
            dex:
              null_rule: never
    dimensions:
      - name: study_year
        type: categorical
        description: 2026 = GTA 6 release year; 2025 = seasonality control.
        config:
          meta:
            dex:
              null_rule: never
      - name: days_from_release
        type: categorical
        description: 0 on that year's anchor Thursday.
        config:
          meta:
            dex:
              unit: days
              null_rule: never
      - name: iso_day_of_week
        type: categorical
        description: 1 = Monday ... 7 = Sunday.
        config:
          meta:
            dex:
              null_rule: never
      - name: is_gta_release_day
        type: categorical
        config:
          meta:
            dex:
              null_rule: never
    config:
      meta:
        dex:
          population:
            rule: Every calendar day in the spine; 2025 days belong to the control year (anchor Thu 20 Nov 2025), 2026 days to the study (anchor Thu 19 Nov 2026).
          assumptions:
            - decision: Control anchor
              chosen: Thu 20 Nov 2025 vs Thu 13 Nov 2025
              evidence: request
              detail: same week of November, one year earlier, both a week before US Thanksgiving week
            - decision: Thursday comparison roles
              chosen: removed
              evidence: request
              detail: they tagged the old index's release and baseline Thursdays
              column: comparison_role
