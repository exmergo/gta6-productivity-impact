version: 2

models:
  - name: fct_thursday_lift
    description: 'One row per signal per study year: the release Thursday''s value over the Thursday before.'
    config:
      meta:
        dex:
          grain:
            - thursday_lift_key
          population:
            rule: Every (source, signal, geo, study year) that has a row on either compared Thursday.
          assumptions:
            - decision: Index components
              chosen: day_off_intent signals of google_trends, bluesky and reddit
              evidence: request
              detail: Hacker News is too sparse (334 hits in 107 days, .dex/review/05); Wikipedia is hype or reference only
            - decision: Low-resolution Trends terms
              chosen: excluded from the index when the baseline is below 5
              evidence: data
              detail: Trends rounds to integers; a baseline of 1-4 turns a one-point wobble into a 25-100% lift
            - decision: Surrogate key
              chosen: md5 of the natural grain
              evidence: default
              detail: the key is md5 of the composite Dex drafts as the grain, so the two describe the same rows; MetricFlow needs a single-column primary entity
    columns:
      - name: thursday_lift_key
        config:
          meta:
            dex:
              role: key
              null_rule: never
        data_tests:
          - unique
          - not_null
      - name: source
        config:
          meta:
            dex:
              role: dimension
              null_rule: never
        data_tests:
          - not_null
      - name: signal
        config:
          meta:
            dex:
              role: dimension
              null_rule: never
        data_tests:
          - not_null
      - name: signal_family
        config:
          meta:
            dex:
              role: dimension
              null_rule: never
        data_tests:
          - not_null
      - name: geo
        config:
          meta:
            dex:
              role: dimension
              null_rule: never
        data_tests:
          - not_null
      - name: study_year
        config:
          meta:
            dex:
              role: dimension
              null_rule: never
        data_tests:
          - not_null
      - name: release_day
        config:
          meta:
            dex:
              role: time
              null_rule: never
        data_tests:
          - not_null
      - name: baseline_value
        config:
          meta:
            dex:
              role: measure
              null_rule: NULL when the baseline Thursday is not available
              aggregation: max
              additivity: non_additive
              unit: count or index
      - name: release_value
        config:
          meta:
            dex:
              role: measure
              null_rule: NULL until the release Thursday has closed and loaded
              aggregation: max
              additivity: non_additive
              unit: count or index
      - name: is_baseline_available
        config:
          meta:
            dex:
              role: attribute
              null_rule: never
        data_tests:
          - not_null
      - name: is_release_available
        config:
          meta:
            dex:
              role: attribute
              null_rule: never
        data_tests:
          - not_null
      - name: lift
        description: release_value / baseline_value. 1.0 = a normal week.
        config:
          meta:
            dex:
              role: measure
              null_rule: NULL unless both Thursdays are available and the baseline is above zero
              aggregation: max
              additivity: non_additive
              unit: ratio
      - name: is_index_component
        description: True for the day-off intent signals of Google Trends (baseline >= 5), Bluesky and Reddit.
        config:
          meta:
            dex:
              role: dimension
              null_rule: never
        data_tests:
          - not_null
