version: 2
semantic_models:
- name: fct_day_off_index
  description: The Day-Off Index, one row per window, with its breakdown.
  model: ref('fct_day_off_index')
  defaults:
    agg_time_dimension: current_start_week
  entities:
  - name: day_off_index_window
    type: primary
    expr: index_window
    config: &id001
      meta:
        dex:
          null_rule: never
  dimensions:
  - name: breakdown
    type: categorical
    description: Every phrase's change. Always report it with the index.
    config: *id001
  - name: current_start_week
    type: time
    type_params:
      time_granularity: day
    config: *id001
  - name: current_end_week
    type: time
    type_params:
      time_granularity: day
    config: *id001
  - name: prior_start_week
    type: time
    type_params:
      time_granularity: day
    config: *id001
  - name: prior_end_week
    type: time
    type_params:
      time_granularity: day
    config: *id001
  - name: batch_id
    type: categorical
    config: *id001
  measures:
  - name: day_off_index_measure
    agg: max
    expr: day_off_index
    description: Average YoY change of the phrases, in percent.
- name: fct_day_off_index_terms
  description: 'The Day-Off Index breakdown: one row per search phrase.'
  model: ref('fct_day_off_index_terms')
  defaults:
    agg_time_dimension: current_start_week
  entities:
  - name: day_off_index_term
    type: primary
    expr: term
    config: *id001
  dimensions:
  - name: term
    type: categorical
    description: The search phrase.
    config: *id001
  - name: current_start_week
    type: time
    type_params:
      time_granularity: day
    config: *id001
  - name: batch_id
    type: categorical
    config: *id001
  measures:
  - name: term_pct_change
    agg: max
    expr: pct_change
  - name: term_current_avg_interest
    agg: max
    expr: current_avg_interest
  - name: term_prior_avg_interest
    agg: max
    expr: prior_avg_interest
