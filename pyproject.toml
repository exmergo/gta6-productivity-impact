[project]
name = "gta6-impact"
version = "0.1.0"
description = "Measuring GTA 6's impact on global productivity, one Thursday at a time. Built with Dex."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11,<3.13"
dependencies = [
    "exmergo-dex-core[duckdb,semantic]==1.18.0",
    "duckdb>=1.1",
    "httpx>=0.27",
    "pyarrow>=17",
    "jinja2>=3.1",
    "trendspy>=0.1.6",
]

[project.scripts]
gta6 = "gta6_impact.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gta6_impact"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
extend-exclude = [".dex", ".agents"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint.per-file-ignores]
# HTML and CSS templates read better unwrapped.
"src/gta6_impact/site.py" = ["E501"]
